<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Cymatics Fractal Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            color: white;
        }
        #simulation-container { 
            width: 100%; 
            height: 100vh; 
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        #errorDisplay {
            color: red;
            background-color: rgba(255,0,0,0.1);
            padding: 10px;
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="errorDisplay"></div>
    <div id="simulation-container"></div>
    <div id="controls">
        <div class="slider-container">
            <label>Speed</label>
            <input type="range" id="speedSlider" min="0" max="2" step="0.1" value="1">
        </div>
        <div class="slider-container">
            <label>Intensity</label>
            <input type="range" id="intensitySlider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="slider-container">
            <label>Fractal Type</label>
            <select id="fractalType">
                <option value="mandelbrot">Mandelbrot</option>
                <option value="julia">Julia Set</option>
                <option value="sierpinski">Sierpinski Triangle</option>
                <option value="koch">Koch Snowflake</option>
            </select>
        </div>
        <div class="btn-container">
            <button id="startBtn">Start Simulation</button>
            <button id="resetBtn">Reset</button>
            <button id="viewBtn">Top View</button>
        </div>
    </div>

    <script>
        // Global error handling
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDisplay = document.getElementById('errorDisplay');
            errorDisplay.style.display = 'block';
            errorDisplay.innerHTML = `
                Error: ${message}<br>
                Source: ${source}<br>
                Line: ${lineno}<br>
                Column: ${colno}<br>
                Error Object: ${error}
            `;
            return false;
        };

        class CymaticsFractalSimulation {
            constructor(container) {
                try {
                    // Scene setup
                    this.scene = new THREE.Scene();
                    this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    this.renderer = new THREE.WebGLRenderer({ antialias: true });
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                    container.appendChild(this.renderer.domElement);

                    // Bounding box for particles
                    this.boundingBox = {
                        width: 4,
                        depth: 4,
                        height: 2
                    };

                    // Particles and simulation parameters
                    this.particleCount = 5000; // Reduced for mobile performance
                    this.particleGeometry = new THREE.BufferGeometry();
                    this.particleMaterial = new THREE.PointsMaterial({ 
                        size: 0.1, 
                        vertexColors: true 
                    });
                    this.particleSystem = new THREE.Points(this.particleGeometry, this.particleMaterial);
                    this.scene.add(this.particleSystem);

                    // Simulation state
                    this.isSimulating = false;
                    this.speedFactor = 1;
                    this.intensityFactor = 0.5;
                    this.currentFractalType = 'mandelbrot';

                    // Camera setup
                    this.camera.position.set(0, 2, 5);
                    this.camera.lookAt(0, 0, 0);

                    // Initialize and setup
                    this.initParticles();
                    this.setupEventListeners();
                    this.animate();
                } catch (error) {
                    console.error('Initialization error:', error);
                    this.showError(error);
                }
            }

            showError(error) {
                const errorDisplay = document.getElementById('errorDisplay');
                errorDisplay.style.display = 'block';
                errorDisplay.innerHTML = `Simulation Error: ${error.message}`;
            }

            initParticles() {
                const positions = new Float32Array(this.particleCount * 3);
                const colors = new Float32Array(this.particleCount * 3);

                for (let i = 0; i < this.particleCount; i++) {
                    // Distribute particles within bounding box
                    positions[i*3] = (Math.random() - 0.5) * this.boundingBox.width;     // x
                    positions[i*3 + 1] = 0;                                              // y (flat surface)
                    positions[i*3 + 2] = (Math.random() - 0.5) * this.boundingBox.depth; // z

                    // Initial random colors
                    colors[i*3] = Math.random();
                    colors[i*3 + 1] = Math.random();
                    colors[i*3 + 2] = Math.random();
                }

                this.particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                this.particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            }

            applyFractalPattern() {
                if (!this.isSimulating) return;

                const positions = this.particleGeometry.getAttribute('position').array;
                const colors = this.particleGeometry.getAttribute('color').array;

                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const z = positions[i + 2];

                    // Simplified fractal height calculation
                    let height = 0;
                    switch(this.currentFractalType) {
                        case 'mandelbrot':
                            height = this.simpleFractalHeight(x, z);
                            break;
                        case 'julia':
                            height = Math.sin(x) * Math.cos(z) * this.intensityFactor;
                            break;
                        case 'sierpinski':
                            height = Math.abs(Math.sin(x * 5) * Math.cos(z * 5)) * this.intensityFactor;
                            break;
                        case 'koch':
                            height = Math.tan(x * z) * 0.1 * this.intensityFactor;
                            break;
                    }

                    // Limit height to bounding box
                    positions[i + 1] = Math.min(height, this.boundingBox.height);

                    // Dynamic color blending
                    colors[i] = Math.abs(Math.sin(positions[i + 1] * 10));
                    colors[i + 1] = Math.abs(Math.cos(positions[i + 1] * 5));
                    colors[i + 2] = Math.abs(Math.tan(positions[i + 1] * 3));
                }

                this.particleGeometry.attributes.position.needsUpdate = true;
                this.particleGeometry.attributes.color.needsUpdate = true;
            }

            // Simplified fractal height method
            simpleFractalHeight(x, z) {
                return Math.sin(x * 3) * Math.cos(z * 3) * this.intensityFactor;
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.applyFractalPattern();
                this.renderer.render(this.scene, this.camera);
            }

            setupEventListeners() {
                const speedSlider = document.getElementById('speedSlider');
                const intensitySlider = document.getElementById('intensitySlider');
                const fractalType = document.getElementById('fractalType');
                const startBtn = document.getElementById('startBtn');
                const resetBtn = document.getElementById('resetBtn');
                const viewBtn = document.getElementById('viewBtn');

                if (speedSlider) {
                    speedSlider.addEventListener('input', (e) => {
                        this.speedFactor = parseFloat(e.target.value);
                    });
                }

                if (intensitySlider) {
                    intensitySlider.addEventListener('input', (e) => {
                        this.intensityFactor = parseFloat(e.target.value);
                    });
                }

                if (fractalType) {
                    fractalType.addEventListener('change', (e) => {
                        this.currentFractalType = e.target.value;
                    });
                }

                if (startBtn) {
                    startBtn.addEventListener('click', () => {
                        this.isSimulating = !this.isSimulating;
                        startBtn.textContent = this.isSimulating ? 'Pause' : 'Start Simulation';
                    });
                }

                if (resetBtn) {
                    resetBtn.addEventListener('click', () => {
                        this.initParticles();
                        this.isSimulating = false;
                        if (startBtn) startBtn.textContent = 'Start Simulation';
                    });
                }

                if (viewBtn) {
                    viewBtn.addEventListener('click', () => {
                        const currentPosition = this.camera.position;
                        if (Math.abs(currentPosition.z) > Math.abs(currentPosition.y)) {
                            // Switch to top view
                            this.camera.position.set(0, 5, 0);
                            this.camera.lookAt(0, 0, 0);
                        } else {
                            // Switch back to side view
                            this.camera.position.set(0, 2, 5);
                            this.camera.lookAt(0, 0, 0);
                        }
                    });
                }
            }
        }

        // Initialize simulation on page load
        window.addEventListener('load', () => {
            try {
                const container = document.getElementById('simulation-container');
                if (container) {
                    new CymaticsFractalSimulation(container);
                } else {
                    throw new Error('Simulation container not found');
                }
            } catch (error) {
                console.error('Initialization error:', error);
                const errorDisplay = document.getElementById('errorDisplay');
                if (errorDisplay) {
                    errorDisplay.style.display = 'block';
                    errorDisplay.innerHTML = `Startup Error: ${error.message}`;
                }
            }
        });
    </script>
</body>
</html>
