<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cymatics Fractal Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="startStop">Start</button>
        <button id="reset">Reset</button>
        <button id="viewTop">View from Top</button><br>
        <label for="algorithm">Cymatics Algorithm:</label>
        <select id="algorithm">
            <option value="standingWave">Standing Wave</option>
            <option value="radialPulse">Radial Pulse</option>
            <option value="spiralVortex">Spiral Vortex</option>
            <option value="harmonicConvergence">Harmonic Convergence</option>
        </select><br>
        <label for="fractalAlgorithm">Fractal Algorithm:</label>
        <select id="fractalAlgorithm">
            <option value="none">None</option>
            <option value="mandelbrot">Mandelbrot Set</option>
            <option value="julia">Julia Set</option>
            <option value="koch">Koch Snowflake</option>
            <option value="sierpinski">Sierpinski Triangle</option>
        </select>
    </div>
    <script>
        const PARTICLE_COUNT = 1000;
        const BOX_SIZE = 10;
        const PARTICLE_SIZE = 0.3;
        const COLORS = [0xff0000, 0x00ff00, 0x0000ff];

        let scene, camera, renderer, particles, geometry, material;
        let isRunning = false;
        let algorithm = 'standingWave';
        let fractalAlgorithm = 'none';
        let isTopView = false;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i * 3] = (Math.random() - 0.5) * BOX_SIZE;
                positions[i * 3 + 1] = (Math.random() - 0.5) * BOX_SIZE;
                positions[i * 3 + 2] = (Math.random() - 0.5) * BOX_SIZE;

                const color = COLORS[i % 3];
                colors[i * 3] = (color >> 16 & 255) / 255;
                colors[i * 3 + 1] = (color >> 8 & 255) / 255;
                colors[i * 3 + 2] = (color & 255) / 255;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({ size: PARTICLE_SIZE, vertexColors: true });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize, false);
            setupControls();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupControls() {
            document.getElementById('startStop').addEventListener('click', () => {
                isRunning = !isRunning;
                document.getElementById('startStop').textContent = isRunning ? 'Stop' : 'Start';
            });

            document.getElementById('reset').addEventListener('click', resetParticles);

            document.getElementById('algorithm').addEventListener('change', (event) => {
                algorithm = event.target.value;
            });

            document.getElementById('fractalAlgorithm').addEventListener('change', (event) => {
                fractalAlgorithm = event.target.value;
            });

            document.getElementById('viewTop').addEventListener('click', () => {
                isTopView = !isTopView;
                if (isTopView) {
                    camera.position.set(0, 20, 0);
                    camera.lookAt(0, 0, 0);
                } else {
                    camera.position.set(0, 0, 15);
                    camera.lookAt(0, 0, 0);
                }
            });
        }

        function resetParticles() {
            const positions = geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i * 3] = (Math.random() - 0.5) * BOX_SIZE;
                positions[i * 3 + 1] = (Math.random() - 0.5) * BOX_SIZE;
                positions[i * 3 + 2] = (Math.random() - 0.5) * BOX_SIZE;
            }
            geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isRunning) {
                const positions = geometry.attributes.position.array;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const x = positions[i * 3];
                    const y = positions[i * 3 + 1];
                    const z = positions[i * 3 + 2];

                    // Apply Cymatics Algorithm
                    switch (algorithm) {
                        case 'standingWave':
                            positions[i * 3 + 1] = y + Math.sin(x + Date.now() * 0.001) * 0.01;
                            break;
                        case 'radialPulse':
                            const distance = Math.sqrt(x * x + z * z);
                            positions[i * 3 + 1] = y + Math.sin(distance + Date.now() * 0.001) * 0.01;
                            break;
                        case 'spiralVortex':
                            const angle = Math.atan2(z, x);
                            positions[i * 3] = x + Math.cos(angle + Date.now() * 0.001) * 0.01;
                            positions[i * 3 + 2] = z + Math.sin(angle + Date.now() * 0.001) * 0.01;
                            break;
                        case 'harmonicConvergence':
                            positions[i * 3] = x + Math.sin(y + Date.now() * 0.001) * 0.01;
                            positions[i * 3 + 2] = z + Math.cos(y + Date.now() * 0.001) * 0.01;
                            break;
                    }

                    // Apply Fractal Algorithm
                    switch (fractalAlgorithm) {
                        case 'mandelbrot':
                            // Mandelbrot-inspired movement
                            const cx = x * 0.1;
                            const cy = y * 0.1;
                            let zx = 0, zy = 0;
                            for (let iter = 0; iter < 10; iter++) {
                                const xtemp = zx * zx - zy * zy + cx;
                                zy = 2 * zx * zy + cy;
                                zx = xtemp;
                            }
                            positions[i * 3] += zx * 0.01;
                            positions[i * 3 + 1] += zy * 0.01;
                            break;
                        case 'julia':
                            // Julia-inspired movement
                            const cRe = -0.7, cIm = 0.27015;
                            let zx2 = x * 0.1, zy2 = y * 0.1;
                            for (let iter = 0; iter < 10; iter++) {
                                const xtemp = zx2 * zx2 - zy2 * zy2 + cRe;
                                zy2 = 2 * zx2 * zy2 + cIm;
                                zx2 = xtemp;
                            }
                            positions[i * 3] += zx2 * 0.01;
                            positions[i * 3 + 1] += zy2 * 0.01;
                            break;
                        case 'koch':
                            // Koch Snowflake-inspired movement
                            const angleKoch = Math.atan2(y, x);
                            positions[i * 3] += Math.cos(angleKoch * 3) * 0.01;
                            positions[i * 3 + 1] += Math.sin(angleKoch * 3) * 0.01;
                            break;
                        case 'sierpinski':
                            // Sierpinski Triangle-inspired movement
                            positions[i * 3] += (Math.random() - 0.5) * 0.01;
                            positions[i * 3 + 1] += (Math.random() - 0.5) * 0.01;
                            break;
                    }
                }
                geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
