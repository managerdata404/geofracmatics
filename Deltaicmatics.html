<!DOCTYPE html>
<html>
<head>
    <title>3D Deltaic Cymatics with Flow Vectors</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            z-index: 100;
        }
        .slider-container {
            margin: 10px 0;
        }
        .button-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        button {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .legend {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="controls">
        <div class="slider-container">
            Speed: <input type="range" id="speedSlider" min="0" max="100" value="50">
        </div>
        <div class="slider-container">
            Intensity: <input type="range" id="intensitySlider" min="0" max="100" value="50">
        </div>
        <div class="button-container">
            <button onclick="setDeltaType('fluvial')">Fluvial</button>
            <button onclick="setDeltaType('wave')">Wave</button>
            <button onclick="setDeltaType('tidal')">Tidal</button>
        </div>
    </div>
    <div class="legend">
        ▶ Red: Main flow direction<br>
        ▶ Blue: Secondary flow<br>
        ▶ Green: Accumulation zones
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, particles, vectors;
        let deltaType = 'fluvial';
        let time = 0;
        
        // Configuration
        const PARTICLE_COUNT = 50000;
        const VECTOR_COUNT = 100;
        const DELTA_AREA_SIZE = 100;
        
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);
            
            camera.position.z = 100;
            camera.position.y = 50;
            camera.lookAt(0, 0, 0);
            
            createParticles();
            createFlowVectors();
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 0);
            scene.add(directionalLight);
            
            // Grid helper
            const grid = new THREE.GridHelper(DELTA_AREA_SIZE, 20);
            scene.add(grid);
            
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
            
            animate();
        }
        
        function createArrow(direction, color, length = 2) {
            const arrowHelper = new THREE.ArrowHelper(
                direction,
                new THREE.Vector3(0, 0, 0),
                length,
                color,
                length * 0.3,
                length * 0.2
            );
            return arrowHelper;
        }
        
        function createFlowVectors() {
            vectors = new THREE.Group();
            
            // Create grid of vectors
            const spacing = DELTA_AREA_SIZE / Math.sqrt(VECTOR_COUNT);
            for(let x = -DELTA_AREA_SIZE/2; x < DELTA_AREA_SIZE/2; x += spacing) {
                for(let z = -DELTA_AREA_SIZE/2; z < DELTA_AREA_SIZE/2; z += spacing) {
                    const mainFlow = createArrow(
                        new THREE.Vector3(1, 0, 0),
                        0xff0000
                    );
                    mainFlow.position.set(x, 0.5, z);
                    
                    const secondaryFlow = createArrow(
                        new THREE.Vector3(0, 0, 1),
                        0x0000ff
                    );
                    secondaryFlow.position.set(x, 0.5, z);
                    
                    vectors.add(mainFlow);
                    vectors.add(secondaryFlow);
                }
            }
            
            scene.add(vectors);
        }
        
        function updateFlowVectors() {
            const speed = document.getElementById('speedSlider').value / 50;
            vectors.children.forEach((arrow, index) => {
                const pos = arrow.position;
                let direction = new THREE.Vector3();
                
                switch(deltaType) {
                    case 'fluvial':
                        if(index % 2 === 0) {
                            // Main flow
                            direction.set(
                                Math.cos(time + pos.z * 0.1),
                                0,
                                Math.sin(time + pos.x * 0.1)
                            );
                        } else {
                            // Secondary flow
                            direction.set(
                                Math.sin(time + pos.z * 0.1),
                                0,
                                Math.cos(time + pos.x * 0.1)
                            );
                        }
                        break;
                        
                    case 'wave':
                        if(index % 2 === 0) {
                            direction.set(
                                Math.sin(time + pos.z * 0.2),
                                0,
                                Math.cos(time) * 0.5
                            );
                        } else {
                            direction.set(
                                Math.cos(time + pos.z * 0.2),
                                0,
                                Math.sin(time) * 0.5
                            );
                        }
                        break;
                        
                    case 'tidal':
                        if(index % 2 === 0) {
                            direction.set(
                                Math.sin(time * 2),
                                0,
                                Math.cos(time * 2)
                            );
                        } else {
                            direction.set(
                                -Math.cos(time * 2),
                                0,
                                Math.sin(time * 2)
                            );
                        }
                        break;
                }
                
                direction.normalize();
                arrow.setDirection(direction);
                arrow.setLength(2 * speed);
            });
        }
        
        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            
            for(let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * DELTA_AREA_SIZE;
                positions[i + 1] = 0;
                positions[i + 2] = (Math.random() - 0.5) * DELTA_AREA_SIZE;
                
                colors[i] = 0.5 + Math.random() * 0.5;
                colors[i + 1] = 0.5 + Math.random() * 0.5;
                colors[i + 2] = 0.5 + Math.random() * 0.5;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        function updateParticles() {
            const positions = particles.geometry.attributes.position.array;
            const speed = document.getElementById('speedSlider').value / 50;
            const intensity = document.getElementById('intensitySlider').value / 50;
            
            for(let i = 0; i < positions.length; i += 3) {
                switch(deltaType) {
                    case 'fluvial':
                        positions[i] += Math.sin(time + positions[i] * 0.1) * speed * 0.1;
                        positions[i + 2] += Math.cos(time + positions[i + 2] * 0.1) * speed * 0.1;
                        break;
                        
                    case 'wave':
                        positions[i] += Math.sin(time + positions[i + 2] * 0.1) * speed * 0.1;
                        positions[i + 2] += Math.cos(time) * speed * 0.05;
                        break;
                        
                    case 'tidal':
                        positions[i] += Math.sin(time * 2) * Math.cos(positions[i + 2] * 0.1) * speed * 0.1;
                        positions[i + 2] += Math.cos(time * 2) * Math.sin(positions[i] * 0.1) * speed * 0.1;
                        break;
                }
                
                positions[i + 1] = Math.sin(
                    Math.sqrt(positions[i] * positions[i] + positions[i + 2] * positions[i + 2]) * 0.1 + 
                    time
                ) * intensity * 2;
                
                if(Math.abs(positions[i]) > DELTA_AREA_SIZE/2) {
                    positions[i] *= -0.9;
                }
                if(Math.abs(positions[i + 2]) > DELTA_AREA_SIZE/2) {
                    positions[i + 2] *= -0.9;
                }
            }
            
            particles.geometry.attributes.position.needsUpdate = true;
        }
        
        function setDeltaType(type) {
            deltaType = type;
        }
        
        function onMouseMove(event) {
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            camera.position.x = mouseX * 20;
            camera.position.y = 50 + mouseY * 10;
            camera.lookAt(0, 0, 0);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            updateParticles();
            updateFlowVectors();
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
